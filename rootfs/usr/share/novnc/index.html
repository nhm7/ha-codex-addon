<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Debian Desktop</title>
<style>html,body{background:#111827;color:#e5e7eb;font:16px system-ui;margin:0;height:100%;display:grid;place-items:center}</style>
<p>Loading desktop…</p>
<script>
  const query = new URLSearchParams({
    autoconnect: 'true',
    reconnect: 'true',
    resize: 'scale',
    path: 'websockify',
  });
  location.replace(`vnc.html?${query}${location.hash}`);
</script>
