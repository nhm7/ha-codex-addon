name: Validate Debian desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository checks
        run: ./scripts/check.sh
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .

  build:
    name: Build Debian desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          # Distribution packages intentionally track the pinned Debian base.
          ignore: DL3008
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: local/debian-desktop:validation
          cache-from: type=gha,scope=debian-desktop
          cache-to: type=gha,mode=max,scope=debian-desktop
