name: Validate Debian Desktop add-on

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run repository checks
        run: ./scripts/check.sh
      - name: Lint shell scripts
        run: shellcheck scripts/check.sh debian-desktop/rootfs/usr/local/bin/desktop-entrypoint
      - name: Lint Home Assistant add-on
        uses: frenck/action-addon-linter@v2.21
        with:
          path: ./debian-desktop

  build:
    name: Build amd64 add-on image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read add-on version
        id: addon
        run: echo "version=$(yq -r .version debian-desktop/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Build and optionally publish Home Assistant image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: amd64
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./debian-desktop
          image: ghcr.io/nhm7/homeassistant-vm-debian
          image-tags: |
            ${{ steps.addon.outputs.version }}
            latest
          labels: |
            io.hass.type=addon
            io.hass.name=Debian Desktop
          push: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          version: ${{ steps.addon.outputs.version }}
