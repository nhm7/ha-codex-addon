name: Validate Debian VM add-ons

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run repository checks
        run: ./scripts/check.sh
      - name: Lint shell scripts
        run: >-
          shellcheck scripts/check.sh
          debian-vm/rootfs/usr/local/bin/vm-entrypoint
          debian-vm-kvm/rootfs/usr/local/bin/vm-entrypoint
      - name: Lint software add-on
        uses: frenck/action-addon-linter@v2.21
        with:
          path: ./debian-vm
      - name: Lint KVM add-on
        uses: frenck/action-addon-linter@v2.21
        with:
          path: ./debian-vm-kvm

  build:
    name: Build ${{ matrix.addon }} amd64 image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - addon: debian-vm
            image: ghcr.io/nhm7/homeassistant-vm-debian
            label: Debian VM (Software)
          - addon: debian-vm-kvm
            image: ghcr.io/nhm7/homeassistant-vm-debian-kvm
            label: Debian VM (KVM)
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read add-on version
        id: addon
        run: echo "version=$(yq -r .version ${{ matrix.addon }}/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Build and optionally publish Home Assistant image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: amd64
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ matrix.addon }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ steps.addon.outputs.version }}
            latest
          labels: |
            io.hass.type=addon
            io.hass.name=${{ matrix.label }}
          push: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          version: ${{ steps.addon.outputs.version }}
