name: Ubuntu Desktop
version: "1.0.0"
slug: ubuntu_desktop
description: Complete Ubuntu 24.04 LTS workspace with Xfce, privately available through Home Assistant Ingress
url: https://github.com/nhm7/homeassistant-vm
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:monitor-dashboard
panel_title: Ubuntu Desktop
homeassistant_api: false
hassio_api: false
auth_api: false
host_network: false
apparmor: true
map:
  - addon_config:rw
  - share:rw
  - media:rw
options:
  environment: []
  startup_script: ""
  working_directory: /share
  resolution: 1440x900
schema:
  environment:
    - str
  startup_script: str
  working_directory: str
  resolution: match(^[0-9]{3,4}x[0-9]{3,4}$)
